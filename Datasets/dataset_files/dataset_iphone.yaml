dataset_name: iphone

# ARKit's nominal frame rate (the app streams at 30 fps by default, 10/60 selectable). rgb.csv takes every frame's
# real timestamp from frames.jsonl, so this value is only the nominal fps written to calibration.yaml.
rgb_hz: 30.0
modes: ['mono']
# ARKit hands out the ISP-rectified image with a pinhole intrinsics matrix and no distortion model; the app rescales K
# to the streamed resolution, so calibration.yaml writes it as is.
cam_models: ['pinhole']
raw_formats: ['images']

# All sequences are user-recorded with `pixi run record-iphone [<sequence_name>]`: the ARStream iOS app
# (github.com/VSLAM-LAB/arstream) streams RGB + intrinsics + ARKit pose over USB or Wi-Fi, the raw recording
# (rgb/<timestamp>.jpg, frames.jsonl, rgb.txt, arkit_poses.txt) lands in VSLAM-LAB-Benchmark/IPHONE/<sequence_name>/
# and the sequence name is appended to sequence_names below. A recording made with `arstream record` on another
# machine can be dropped in the same place by hand and registered here.
sequence_location: local

# No target_resolution: the app streams 640x480 (its default) and the phone's JPEGs go into rgb_0/ untouched.

# sequence_name = the recording's folder name (record-iphone defaults it to YYYYMMDD_HHMMSS).
sequence_names:
  - desk_20261012

about:
  license: N/A (user-recorded data)
  summary: iPhone recordings streamed by the ARStream app - RGB, intrinsics and ARKit's visual-inertial pose, the latter as a drifting (not metrological) groundtruth
  homepage: https://github.com/VSLAM-LAB/arstream
  features:
    - Real
    - Handheld
  authors:
    - Alejandro Fontan
  access: N/A
  publication: N/A
