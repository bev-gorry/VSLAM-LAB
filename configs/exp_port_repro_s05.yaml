# Reproduction of the original hybrid pipeline on sskall-s05 (multi-session-sfm/reviews/reproduction_test_plan.md).
# Original settings recovered from its run log: one shared OPENCV camera (single_camera_per_folder: 0), global
# mapper (GLOMAP 1.2.0 originally), MegaLoc matrix at the sequence root (D.npy, rows = rgb.csv), threshold 0.55
# (gives the original 30,037 LightGlue pairs), LightGlue kept if > 40 matches, pairs kept if >= 10 matches.
# verification: glomap -> COLMAP's geometric_verifier set up like GLOMAP 1.2.0's relative-pose stage.
exp_port_repro_s05:
  Config: config_ssk05_ours.yaml
  NumRuns: 1
  Parameters: {verbose: 0, matcher_type: hybrid, matching_type: sift_bruteforce, mapper_type: glomap,
               single_camera_per_folder: 0, random_seed: 0,
               pair_selection: vpr, vpr_matrix: D.npy, vpr_rgb_csv: rgb.csv, vpr_threshold: 0.55,
               lg_min_matches: 40, min_matches: 10, verification: glomap}
  Module: colmap
