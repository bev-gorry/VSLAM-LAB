# Joint multi-session reconstruction of the full Eiffel Tower dataset (effall-full = eff16/18/20-full), recreating the
# original paper's setting with the final pipeline (hybrid matcher, COLMAP verification + incremental mapper):
#   frames  exactly the submission's 6,584 (every 2nd within each session): rgb_step2.csv, written from its rgb_exp.csv
#           by aqua_scripts/write_frame_lists.py
#   camera  one camera for all three sessions, native 1920x1080, starting from eff20's calibration (the submission's
#           effall-full/calibration.yaml) with focal length and distortion refined, principal point fixed
#   VPR     threshold 0.5 (the submission's dist_threshold for Eiffel)
# init_pair cross_session: the mapper starts from the cross-session pair with the most verified matches (with enough
# parallax for COLMAP: median triangulation angle >= 20 deg). Learned
# keypoints are matched only across sessions, so a start inside one session can fragment (s04); on the subsets this
# start gives the same results as COLMAP's own when that one works (remap tests, 21 Oct).
exp_eff_full_ours:
  Config: config_eff_full_joint.yaml
  NumRuns: 1
  Parameters: {verbose: 0, rgb_csv: rgb_step2.csv, matcher_type: hybrid, matching_type: sift_bruteforce, mapper_type: colmap,
               per_session_calibration: 0, optimize_intrinsics: 1, random_seed: 0,
               hybrid_features: superpoint, hybrid_matching: lightglue,
               pair_selection: vpr, vpr_matrix: vpr-lab/D.npy, vpr_rgb_csv: rgb.csv, vpr_threshold: 0.48,
               lg_min_matches: 40, min_matches: 10, verification: colmap,
               init_pair: cross_session}
  Module: colmap
