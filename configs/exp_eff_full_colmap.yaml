# The "COLMAP" column on full Eiffel Tower, as exp_x1_ssk_subsets_colmap on the subsets: one joint reconstruction of
# all sessions (effall-full) with exhaustive SIFT over all pairs and nothing learned. Frames, camera and intrinsics as
# the joint Ours run (exp_eff_full_joint.yaml), so the two differ only in the cross-session matching: the submission's
# 6,584 frames (rgb_step2.csv), one camera from eff20's calibration with focal length and distortion refined.
# COLMAP's own initial pair (init_pair default), as every baseline.
# Run on Aqua: aqua_scripts/colmap_full.pbs (array index 1).
exp_eff_full_colmap:
  Config: config_eff_full_joint.yaml
  NumRuns: 1
  Parameters: {verbose: 0, rgb_csv: rgb_step2.csv, matcher_type: exhaustive, matching_type: sift_bruteforce,
               mapper_type: colmap, per_session_calibration: 0, optimize_intrinsics: 1, random_seed: 0}
  Module: colmap
