# Ablation A1 (Table III): features and matcher on the VPR-selected cross-session pairs (hybrid_features x
# hybrid_matching), all else the final pipeline: per-session flat cameras kept fixed (each ssk1X-s05/calibration.yaml),
# VPR threshold 0.55, COLMAP verification + incremental mapper, seed 0.
# Rotations follow the features: superpoint / aliked at 4 rotations (not rotation invariant), sift once.
# bruteforce: mutual nearest neighbours, plus Lowe's ratio test (0.8) for sift.
# Extra row: sift_only (no learned cross-session matches: exhaustive SIFT over all pairs; COLMAP's own start).
# The seed repeat of superpoint_lightglue was dropped for the clean reruns (22 Oct).
# init_pair cross_session (22 Oct, clean reruns): the mapper starts from the cross-session pair with the most verified
# matches and a median triangulation angle >= 20 deg. Learned keypoints are matched only across sessions, so a start
# inside one session can fragment (s04).

exp_a1_s05_superpoint_lightglue:
  Config: config_ssk05_joint.yaml
  NumRuns: 1
  Parameters: {verbose: 0, matcher_type: hybrid, matching_type: sift_bruteforce, mapper_type: colmap,
               per_session_calibration: 1, optimize_intrinsics: 0, random_seed: 2,
               hybrid_features: superpoint, hybrid_matching: lightglue,
               pair_selection: vpr, vpr_matrix: vpr-lab/D.npy, vpr_rgb_csv: rgb.csv, vpr_threshold: 0.55,
               lg_min_matches: 40, min_matches: 10, verification: colmap,
               init_pair: cross_session}
  Module: colmap

