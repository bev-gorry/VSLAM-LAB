# Smoke tests of matcher_type: hybrid on every 10th frame of sskall-s05 (74 images, all three sessions).
# Only check that the chain runs and compare mappers; not a result. The two experiments differ ONLY in mapper_type.
exp_port_smoke_glomap:
  Config: config_ssk05_ours.yaml
  NumRuns: 1
  Parameters: {verbose: 0, rgb_step: 10, matcher_type: hybrid, matching_type: sift_bruteforce, mapper_type: glomap,
               single_camera_per_folder: 0, random_seed: 0,
               pair_selection: vpr, vpr_matrix: D.npy, vpr_rgb_csv: rgb.csv, vpr_threshold: 0.55,
               lg_min_matches: 40, min_matches: 10, verification: glomap}
  Module: colmap

exp_port_smoke_colmap:
  Config: config_ssk05_ours.yaml
  NumRuns: 1
  Parameters: {verbose: 0, rgb_step: 10, matcher_type: hybrid, matching_type: sift_bruteforce, mapper_type: colmap,
               single_camera_per_folder: 0, random_seed: 0,
               pair_selection: vpr, vpr_matrix: D.npy, vpr_rgb_csv: rgb.csv, vpr_threshold: 0.55,
               lg_min_matches: 40, min_matches: 10, verification: glomap}
  Module: colmap
