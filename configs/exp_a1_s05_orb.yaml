# Ablation A1 (Table III), extra row: ORB (OpenCV, 2048 keypoints, extracted once: rotation invariant) matched with
# BruteForce (Hamming mutual nearest neighbours; LightGlue has no ORB weights) on the VPR-selected cross-session pairs.
# Everything else as exp_a1_s05.yaml: per-session flat cameras kept fixed, VPR threshold 0.55, COLMAP verification +
# incremental mapper from the cross-session start, seed 0. Own file so --overwrite only touches this run.

exp_a1_s05_orb_bruteforce:
  Config: config_ssk05_joint.yaml
  NumRuns: 1
  Parameters: {verbose: 0, matcher_type: hybrid, matching_type: sift_bruteforce, mapper_type: colmap,
               per_session_calibration: 1, optimize_intrinsics: 0, random_seed: 0,
               hybrid_features: orb, hybrid_matching: bruteforce,
               pair_selection: vpr, vpr_matrix: vpr-lab/D.npy, vpr_rgb_csv: rgb.csv, vpr_threshold: 0.55,
               lg_min_matches: 40, min_matches: 10, verification: colmap,
               init_pair: cross_session}
  Module: colmap
