# Ablation of the VPR threshold on sskall-s05: everything as Ours (configs/exp_sesoko_subsets.yaml,
# exp_sesoko-subsets_ours) except the threshold that selects the cross-session pairs for learned matching.
#   pixi run vslamlab configs/exp_ablation_vpr.yaml        (from the VSLAM-LAB root)
# The threshold is on MegaLoc distances min-max normalised over the whole matrix, self and same-session pairs excluded;
# a cross-session pair is matched if its distance <= threshold, so 1.00 keeps every cross-session pair (no VPR
# selection). 0.55 is Ours itself (exp_sesoko-subsets_ours on sskall-s05): not repeated.
# exp_ablation-vpr_all-pairs: learned matching on every image pair, same-session pairs included (pair_selection: all).

exp_ablation-vpr_040:
  Config: config_sesoko_s05.yaml
  NumRuns: 1
  Parameters: {verbose: 0, matcher_type: hybrid, matching_type: sift_bruteforce, mapper_type: colmap,
               per_session_calibration: 1, optimize_intrinsics: 0, random_seed: 0,
               hybrid_features: superpoint, hybrid_matching: lightglue,
               pair_selection: vpr, vpr_matrix: vpr-lab/D.npy, vpr_rgb_csv: rgb.csv, vpr_threshold: 0.40,
               lg_min_matches: 40, min_matches: 10, verification: colmap,
               init_pair: cross_session}
  Module: colmap

