# Ablation A2 (Table IV): VPR threshold, all else exp_a1_s05_superpoint_lightglue (whose threshold, 0.55, is the
# paper's and is not repeated here). The threshold is on MegaLoc distances min-max normalised over the whole matrix,
# self and same-session pairs excluded; a cross-session pair is matched if its distance <= threshold, so 1.00 keeps
# every cross-session pair (no VPR selection).
# Thresholds (22 Oct): 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.80, 1.00. Table IV runs on Aqua from
# configs/exp_a2_s05_aqua.yaml (same experiments); this file is the record and a PC fallback.
# init_pair cross_session (22 Oct, clean reruns): the mapper starts from the cross-session pair with the most verified
# matches and a median triangulation angle >= 20 deg. Learned keypoints are matched only across sessions, so a start
# inside one session can fragment (s04).

exp_a2_s05_vpr040:
  Config: config_ssk05_joint.yaml
  NumRuns: 1
  Parameters: {verbose: 0, matcher_type: hybrid, matching_type: sift_bruteforce, mapper_type: colmap,
               per_session_calibration: 1, optimize_intrinsics: 0, random_seed: 0,
               hybrid_features: superpoint, hybrid_matching: lightglue,
               pair_selection: vpr, vpr_matrix: vpr-lab/D.npy, vpr_rgb_csv: rgb.csv, vpr_threshold: 0.40,
               lg_min_matches: 40, min_matches: 10, verification: colmap,
               init_pair: cross_session}
  Module: colmap

